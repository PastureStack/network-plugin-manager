name: PastureStack / Network plugin security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-plugin-manager-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUNTIME_IMAGE: local/pasturestack/network-plugin-manager:security-${{ github.sha }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      VERSION_OVERRIDE: security-${{ github.sha }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Go and govulncheck
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go1.27.0.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" 'https://go.dev/dl/go1.27.0.linux-amd64.tar.gz'
          printf '%s  %s\n' \
            '675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685' \
            "$archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          export GOBIN="$RUNNER_TEMP/security-bin"
          export GOTELEMETRY=off
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          printf '%s\n' "$RUNNER_TEMP/go/bin" "$GOBIN" >> "$GITHUB_PATH"

      - name: Test maintained source paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --check HEAD -- . ':(exclude)vendor/**'
          ./scripts/test
          ./scripts/validate
          govulncheck -show verbose ./... | tee evidence/govulncheck.txt

      - name: Download scanner database once
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --download-db-only

      - name: Scan source and create source SBOM
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work:ro" -v "$PWD/evidence:/evidence" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --format json --output /evidence/source-security.json /work
          docker run --rm -v "$PWD:/work:ro" -v "$PWD/evidence:/evidence" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/source.cdx.json /work

      - name: Build reproducible binary and one runtime image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build
          cp bin/network-plugin-manager "$RUNNER_TEMP/network-plugin-manager.first"
          rm -f bin/network-plugin-manager
          ./scripts/build
          cmp "$RUNNER_TEMP/network-plugin-manager.first" bin/network-plugin-manager
          sha256sum bin/network-plugin-manager > evidence/binary.sha256
          ARCH=amd64 TAG="security-${GITHUB_SHA}" REPO=local/pasturestack ./scripts/package
          grep -Fxq "$RUNTIME_IMAGE" dist/images
          docker run --rm --entrypoint /usr/bin/network-plugin-manager \
            "$RUNTIME_IMAGE" --version | grep -Fq "security-${GITHUB_SHA}"

      - name: Scan binary and runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/bin:/product:ro" -v "$PWD/evidence:/evidence" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" rootfs \
            --skip-db-update --offline-scan --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --format json --output /evidence/binary-security.json /product
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence:/evidence" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --format json --output /evidence/image-security.json "$RUNTIME_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence:/evidence" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/image.cdx.json "$RUNTIME_IMAGE"
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ('source-security.json', 'binary-security.json', 'image-security.json'):
              report = json.loads((Path('evidence') / name).read_text())
              vulnerabilities = sum(len(item.get('Vulnerabilities') or []) for item in report.get('Results') or [])
              secrets = sum(len(item.get('Secrets') or []) for item in report.get('Results') or [])
              assert vulnerabilities == 0, (name, vulnerabilities)
              assert secrets == 0, (name, secrets)
          for name in ('source.cdx.json', 'image.cdx.json'):
              bom = json.loads((Path('evidence') / name).read_text())
              assert bom.get('serialNumber'), name
              assert bom.get('components'), name
              assert bom.get('dependencies'), name
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-plugin-manager-security-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Clean owned runner resources
        if: always()
        shell: bash
        run: |
          set +e
          docker image rm -f "$RUNTIME_IMAGE" "$TRIVY_IMAGE" 2>/dev/null
          rm -rf bin dist evidence
